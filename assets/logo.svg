<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141a20"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base plate: sharp-angled tactical frame, off-center -->
  <path d="M 20 18 L 236 14 L 242 232 L 16 238 Z" fill="#0a0e12"/>
  <path d="M 22 20 L 234 16 L 240 230 L 18 236 Z" fill="url(#bgGrad)" stroke="#c8d0d8" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Corner tactical cuts -->
  <polygon points="22,20 60,20 38,46 22,46" fill="#0a0e12" stroke="#c8d0d8" stroke-width="0.6" stroke-opacity="0.5"/>
  <polygon points="234,16 234,54 208,32 208,16" fill="#0a0e12" stroke="#c8d0d8" stroke-width="0.6" stroke-opacity="0.5"/>
  <polygon points="18,236 18,196 44,220 44,236" fill="#0a0e12" stroke="#c8d0d8" stroke-width="0.6" stroke-opacity="0.5"/>
  <polygon points="240,230 202,230 224,204 240,204" fill="#0a0e12" stroke="#c8d0d8" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- Ambient glows behind reticle -->
  <circle cx="128" cy="124" r="88" fill="url(#redGlow)"/>
  <circle cx="132" cy="128" r="56" fill="url(#greenGlow)"/>

  <!-- Outer fractured ring: 4 arc segments with gaps and chamfers -->
  <path d="M 128 40 A 84 84 0 0 1 212 124" fill="none" stroke="#c8d0d8" stroke-width="2.2" stroke-opacity="0.55"/>
  <path d="M 212 124 A 84 84 0 0 1 128 208" fill="none" stroke="#c8d0d8" stroke-width="2.2" stroke-opacity="0.55"/>
  <path d="M 128 208 A 84 84 0 0 1 44 124" fill="none" stroke="#c8d0d8" stroke-width="2.2" stroke-opacity="0.55"/>
  <path d="M 44 124 A 84 84 0 0 1 128 40" fill="none" stroke="#c8d0d8" stroke-width="2.2" stroke-opacity="0.55"/>

  <!-- Ring chamfer ticks at fracture points -->
  <polygon points="128,36 136,46 120,46" fill="#ff3b30" opacity="0.9"/>
  <polygon points="216,124 206,116 206,132" fill="#39ff14" opacity="0.9"/>
  <polygon points="128,212 120,202 136,202" fill="#ff3b30" opacity="0.9"/>
  <polygon points="40,124 50,116 50,132" fill="#39ff14" opacity="0.9"/>

  <!-- Inner hex-ring -->
  <polygon points="128,62 178,95 178,153 128,186 78,153 78,95" fill="none" stroke="#c8d0d8" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Four converging crosshair blades -->
  <!-- Top blade -->
  <polygon points="128,74 138,108 128,116 118,108" fill="#c8d0d8" opacity="0.95"/>
  <polygon points="128,74 124,100 128,108 132,100" fill="#0a0e12" opacity="0.6"/>

  <!-- Right blade -->
  <polygon points="182,128 148,138 140,128 148,118" fill="#c8d0d8" opacity="0.95"/>
  <polygon points="182,128 156,124 148,128 156,132" fill="#0a0e12" opacity="0.6"/>

  <!-- Bottom blade -->
  <polygon points="128,182 118,148 128,140 138,148" fill="#c8d0d8" opacity="0.95"/>
  <polygon points="128,182 132,156 128,148 124,156" fill="#0a0e12" opacity="0.6"/>

  <!-- Left blade -->
  <polygon points="74,128 108,118 116,128 108,138" fill="#c8d0d8" opacity="0.95"/>
  <polygon points="74,128 100,132 108,128 100,124" fill="#0a0e12" opacity="0.6"/>

  <!-- Central reticle core: fractured diamond -->
  <polygon points="128,112 138,128 128,144 118,128" fill="#0a0e12" stroke="#c8d0d8" stroke-width="1.5"/>
  <polygon points="128,118 134,128 128,138 122,128" fill="#39ff14" opacity="0.85"/>
  <polygon points="128,122 131,128 128,134 125,128" fill="#0a0e12"/>

  <!-- Red alarm accents at blade tips -->
  <circle cx="128" cy="72" r="2.5" fill="#ff3b30"/>
  <circle cx="184" cy="128" r="2.5" fill="#ff3b30"/>
  <circle cx="128" cy="184" r="2.5" fill="#ff3b30"/>
  <circle cx="72" cy="128" r="2.5" fill="#ff3b30"/>

  <!-- Precision HUD ticks along diagonals -->
  <line x1="128" y1="56" x2="128" y2="66" stroke="#39ff14" stroke-width="1.5" opacity="0.8"/>
  <line x1="128" y1="190" x2="128" y2="200" stroke="#39ff14" stroke-width="1.5" opacity="0.8"/>
  <line x1="60" y1="128" x2="70" y2="128" stroke="#39ff14" stroke-width="1.5" opacity="0.8"/>
  <line x1="186" y1="128" x2="196" y2="128" stroke="#39ff14" stroke-width="1.5" opacity="0.8"/>

  <!-- Diagonal fracture cracks -->
  <polyline points="128,74 120,90 124,102" fill="none" stroke="#ff3b30" stroke-width="1" opacity="0.7"/>
  <polyline points="182,128 166,120 154,124" fill="none" stroke="#ff3b30" stroke-width="1" opacity="0.7"/>
  <polyline points="128,182 136,166 132,154" fill="none" stroke="#ff3b30" stroke-width="1" opacity="0.7"/>
  <polyline points="74,128 90,136 102,132" fill="none" stroke="#ff3b30" stroke-width="1" opacity="0.7"/>

  <!-- Subtle scanline HUD element - bottom -->
  <line x1="56" y1="216" x2="200" y2="216" stroke="#c8d0d8" stroke-width="0.5" opacity="0.25"/>
  <line x1="64" y1="220" x2="192" y2="220" stroke="#c8d0d8" stroke-width="0.5" opacity="0.15"/>
  <rect x="120" y="214" width="16" height="2" fill="#39ff14" opacity="0.6"/>

  <!-- Top HUD element -->
  <polyline points="60,30 80,30 84,34" fill="none" stroke="#c8d0d8" stroke-width="0.7" opacity="0.4"/>
  <polyline points="196,30 176,30 172,34" fill="none" stroke="#c8d0d8" stroke-width="0.7" opacity="0.4"/>

  <!-- Tiny wordmark -->
  <text x="128" y="247" font-family="monospace" font-size="6" fill="#c8d0d8" fill-opacity="0.45" text-anchor="middle" letter-spacing="1.5">R6//AIMWARE</text>
</svg>
